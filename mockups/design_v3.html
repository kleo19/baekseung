<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>크보에서 100승하기 · 시안 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Oswald:wght@500;700&family=Noto+Sans+KR:wght@500;700;900&family=VT323&family=Nanum+Myeongjo:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Noto Sans KR",sans-serif;background:var(--bg);color:var(--fg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{position:relative;max-width:440px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;background:var(--app-bg)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.disp{font-family:"Black Han Sans",sans-serif;font-weight:400}
.num{font-family:"Oswald",sans-serif;font-weight:700}
.only{display:none}
.tC .oC,.tD .oD,.tE .oE{display:revert}
.switch{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:99;display:flex;gap:4px;padding:6px;background:rgba(0,0,0,.72);border-radius:0 0 12px 12px}
.switch button{font-size:12px;font-weight:700;color:#aaa;padding:5px 10px;border-radius:8px;white-space:nowrap}
.switch button.on{background:#fff;color:#000}
.press{transition:transform .08s ease-out}
.press:active{transform:scale(.95)}
.toast{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:95;padding:10px 18px;border-radius:10px;background:rgba(0,0,0,.85);color:#fff;font-weight:900;font-size:15px;pointer-events:none;opacity:0}

/* 홈 */
.home{padding:56px 18px 14px;gap:12px}
.logo{text-align:center;margin:14px 0 6px}
.logo .l1{font-size:26px;display:block}
.logo .l2{display:flex;justify-content:center;align-items:flex-end;gap:6px;line-height:.9}
.logo .big{font-family:"Oswald";font-weight:700;font-size:104px;line-height:.85}
.logo .seung{font-size:46px;padding-bottom:8px}
.logo .l3{font-size:15px;margin-top:10px;opacity:.75}
.playmain{height:88px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:32px}
.playmain small{font-size:13px;font-family:"Noto Sans KR";font-weight:700;opacity:.8;text-align:left}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{height:70px;display:flex;flex-direction:column;justify-content:center;padding:0 14px;text-align:left}
.mode b{font-family:"Black Han Sans";font-weight:400;font-size:21px}
.mode span{font-size:12px;font-weight:700;opacity:.7}
.tabbar{margin-top:auto;display:flex;justify-content:space-around;padding:10px 0 2px}
.tabbar button{font-size:12px;font-weight:900;opacity:.55;padding:6px 10px}
.tabbar button.on{opacity:1}
.disclaim{text-align:center;font-size:10px;opacity:.45;padding:2px 0 6px}

/* 드래프트 */
.draft{padding:44px 0 0}
.topbar{display:flex;align-items:center;gap:10px;padding:6px 14px;position:relative;z-index:2}
.topbar .rnd{font-size:15px;white-space:nowrap}
.gauge{flex:1;height:12px;position:relative;overflow:hidden}
.gauge .fill{position:absolute;inset:0 auto 0 0;width:0;transition:width .7s cubic-bezier(.2,.9,.3,1)}
.gaugev{font-size:18px;min-width:34px;text-align:right}
.reels{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;padding:8px 14px 0;position:relative;z-index:2}
.reel{position:relative;height:84px;overflow:hidden}
.reel .lab{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:11px;font-weight:900;letter-spacing:.18em;z-index:3}
.reel .win{position:absolute;inset:22px 6px 6px;overflow:hidden;z-index:2}
.reel .strip{position:absolute;left:0;right:0;top:0}
.reel .cell{height:56px;display:flex;align-items:center;justify-content:center;font-size:40px;white-space:nowrap}
.reel.team .cell{font-size:34px}
.rerolls{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;padding:6px 14px 0;position:relative;z-index:2}
.reroll{height:38px;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px}
.reroll b{font-family:"Oswald";font-size:17px}
.reroll:disabled{opacity:.3;filter:grayscale(1)}
.field{position:relative;margin:6px 14px 0;height:300px}
.field svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);min-width:74px;height:36px;padding:0 10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;white-space:nowrap}
.actions{padding:8px 14px 16px;margin-top:auto}
.spin{width:100%;height:66px;font-size:30px;letter-spacing:.06em;position:relative;overflow:hidden}
.spin:disabled{filter:grayscale(.7) brightness(.7)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;height:60%;display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;pointer-events:none;transition:transform .42s cubic-bezier(.2,1.1,.35,1),visibility 0s .42s}
.sheet.up,.sheet.peek{visibility:visible;pointer-events:auto;transition:transform .42s cubic-bezier(.2,1.1,.35,1),visibility 0s}
.sheet.up{transform:translateY(0)}
.sheet.peek{transform:translateY(calc(100% - 84px))}
.sheet .grab{width:44px;height:5px;border-radius:3px;margin:8px auto 4px;opacity:.5;background:currentColor;cursor:pointer}
.sheet .head{display:flex;align-items:baseline;gap:8px;padding:2px 16px 8px;cursor:pointer}
.sheet .head b{font-size:22px}
.sheet .head span{font-size:13px;font-weight:700;opacity:.7}
.sheet .peekhint{font-size:12px!important;margin-left:auto}
.sheet .tabs{display:flex;gap:6px;padding:0 14px 8px}
.sheet .tabs button{font-size:13px;font-weight:900;padding:6px 14px}
.list{overflow-y:auto;padding:0 10px 14px;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:1fr repeat(4,44px);align-items:center;padding:9px 10px;gap:2px;text-align:left;opacity:0}
.sheet.up .row{animation:rowin .28s ease-out forwards;animation-delay:calc(var(--i)*30ms + 100ms)}
@keyframes rowin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row .nm{font-size:16px;font-weight:900;line-height:1.1}
.row .ps{font-size:11px;font-weight:700;opacity:.7}
.row .st{text-align:right;font-family:"Oswald";font-size:15px;font-weight:500}
.row .st small{display:block;font-family:"Noto Sans KR";font-size:9px;opacity:.55;font-weight:700}
.row.dim{filter:grayscale(1);opacity:.35!important}
.row.nope{animation:nope .3s!important;opacity:.35}
@keyframes nope{0%,100%{translate:0}25%{translate:-6px}75%{translate:6px}}

/* 결과 */
.result{align-items:center;padding:56px 18px 16px;text-align:center;overflow:hidden}
.result .cap{font-size:14px;font-weight:900;letter-spacing:.3em;opacity:0}
.result .rec{font-size:96px;line-height:1;margin-top:6px;display:flex;align-items:baseline;gap:8px;opacity:0}
.result .rec .dash{font-size:56px;opacity:.6}
.result .rec .l{font-size:60px;opacity:.75}
.badge{margin:14px auto 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;position:relative}
.badge .g{font-family:"Oswald";font-weight:700;font-size:60px;line-height:1}
.badge .gl{font-size:12px;font-weight:900;letter-spacing:.2em}
.lineup{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:12px}
.lu{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:9px 12px;text-align:left;opacity:0}
.lu .p{font-size:13px;font-weight:900;text-align:center}
.lu .n{font-size:16px;font-weight:900}
.lu .n small{display:block;font-size:11px;opacity:.65;font-weight:700}
.resbtns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;width:100%;margin-top:auto;padding-top:12px;opacity:0}
.resbtns button{height:56px;font-size:20px}
canvas.fw{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ═════════ C 전광판 ═════════ */
body.tC{--bg:#000;--app-bg:radial-gradient(circle at 1.5px 1.5px,rgba(255,255,255,.07) 1px,transparent 1.6px) 0 0/6px 6px,linear-gradient(180deg,#071410,#020605);--fg:#e9ffe9;--amb:#ffd23a;--grn:#7dff8a}
.tC .logo .big{font-family:"VT323";font-size:132px;font-weight:400;color:var(--amb);text-shadow:0 0 6px rgba(255,190,40,.9),0 0 22px rgba(255,160,0,.6)}
.tC .logo .seung{color:var(--grn);text-shadow:0 0 8px rgba(80,255,110,.8)}
.tC .logo .l1{text-shadow:0 0 6px rgba(200,255,200,.6)}
.tC .frame{background:linear-gradient(180deg,#0f2a20,#071a13);border:2px solid #23463a;border-radius:4px;box-shadow:inset 0 0 18px rgba(0,0,0,.7)}
.tC .playmain{background:#071a13;border:3px solid var(--amb);border-radius:6px;color:var(--amb);font-family:"Black Han Sans";text-shadow:0 0 10px rgba(255,190,40,.9);box-shadow:0 0 22px rgba(255,190,40,.4),inset 0 0 22px rgba(255,190,40,.25)}
.tC .mode b{color:var(--grn);text-shadow:0 0 8px rgba(80,255,110,.6)}
.tC .tabbar{border-top:2px solid #23463a}.tC .tabbar button.on{color:var(--amb)}
.tC .gauge{background:#03100b;border:1px solid #23463a;height:14px}
.tC .gauge .fill{background:repeating-linear-gradient(90deg,var(--grn) 0 6px,transparent 6px 8px);box-shadow:0 0 10px rgba(80,255,110,.7);transition:width .6s steps(12)}
.tC .gaugev{color:var(--grn);text-shadow:0 0 8px rgba(80,255,110,.8);font-family:"VT323";font-size:26px;font-weight:400}
.tC .reel .lab{color:var(--grn)}
.tC .reel .win{background:#000 radial-gradient(circle at 1.5px 1.5px,rgba(255,255,255,.06) 1px,transparent 1.6px) 0 0/5px 5px;border:1px solid #23463a}
.tC .reel .cell{color:var(--amb);font-family:"Black Han Sans";text-shadow:0 0 8px rgba(255,190,40,.9)}
.tC .reel.year .cell{font-family:"VT323";font-size:56px}
.tC .reel .cell.dimc{opacity:.55;text-shadow:none}
/* 정지: 전구 테두리가 돌고, 글자가 두 번 깜빡이며 켜짐 */
.tC .reel::after{content:"";position:absolute;inset:0;border-radius:4px;pointer-events:none;opacity:0;background:repeating-linear-gradient(90deg,var(--amb) 0 4px,transparent 4px 10px) top/100% 3px no-repeat,repeating-linear-gradient(90deg,var(--amb) 0 4px,transparent 4px 10px) bottom/100% 3px no-repeat,repeating-linear-gradient(0deg,var(--amb) 0 4px,transparent 4px 10px) left/3px 100% no-repeat,repeating-linear-gradient(0deg,var(--amb) 0 4px,transparent 4px 10px) right/3px 100% no-repeat;filter:drop-shadow(0 0 4px var(--amb))}
.tC .reel.lock::after{animation:bulbs .9s steps(6) 1 forwards}
@keyframes bulbs{0%{opacity:1;background-position:0 0,0 100%,0 0,100% 0}99%{opacity:1;background-position:60px 0,-60px 100%,0 -60px,100% 60px}100%{opacity:0}}
.tC .reel.lock .cell{animation:blink .5s steps(1) 1}
@keyframes blink{0%{opacity:.2}25%{opacity:1}50%{opacity:.2}75%,100%{opacity:1}}
.tC .slot{background:#000;border:2px solid #23463a;color:var(--amb);border-radius:4px;text-shadow:0 0 6px rgba(255,190,40,.8)}
.tC .slot.empty{color:#4f8a72;text-shadow:none;border-style:dashed}
.tC .slot .ch{opacity:0;animation:chon .01s linear forwards;animation-delay:calc(var(--k)*70ms)}
@keyframes chon{to{opacity:1}}
.tC .slot.justset{border-color:var(--amb);box-shadow:0 0 12px rgba(255,190,40,.6)}
.tC .spin{background:#000;border:3px solid var(--amb);color:var(--amb);border-radius:8px;font-family:"Black Han Sans";text-shadow:0 0 10px rgba(255,190,40,.9);box-shadow:0 0 20px rgba(255,190,40,.45),inset 0 0 18px rgba(255,190,40,.25)}
.tC .reroll{color:var(--grn)}
.tC .marq{position:absolute;left:14px;right:14px;top:6px;height:52px;z-index:5;background:#000;border:2px solid var(--tc);overflow:hidden;display:none;box-shadow:0 0 16px var(--tc)}
.tC .marq.on{display:block}
.tC .marq span{position:absolute;top:50%;left:100%;transform:translateY(-50%);white-space:nowrap;font-family:"Black Han Sans";font-size:30px;color:var(--tc);text-shadow:0 0 10px var(--tc)}
.tC .sheet{background:#04120c;border-top:3px solid #23463a;color:#e9ffe9}
.tC .sheet .tabs button{border:1px solid #23463a;color:var(--grn)}
.tC .sheet .tabs button.on{background:var(--grn);color:#000}
.tC .row{background:#071a13;border:1px solid #163428;border-left:4px solid var(--tc0)}
.tC .row .st{color:var(--amb);font-family:"VT323";font-size:21px;font-weight:400}
.tC .result .cap{color:var(--grn)}
.tC .result .rec{font-family:"VT323";font-weight:400;font-size:120px;color:var(--amb);text-shadow:0 0 10px rgba(255,190,40,.9),0 0 30px rgba(255,150,0,.6)}
.tC .result .rec .l{font-size:80px}
.tC .badge{width:150px;height:110px;border:3px solid var(--grn);border-radius:8px;box-shadow:0 0 24px rgba(80,255,110,.5),inset 0 0 24px rgba(80,255,110,.25)}
.tC .badge .g{color:var(--grn);font-family:"VT323";font-weight:400;font-size:84px;text-shadow:0 0 12px rgba(80,255,110,.9)}
.tC .badge .gl{color:var(--grn)}
.tC .badge.on::after{content:"";position:absolute;inset:-8px;border-radius:12px;background:repeating-linear-gradient(90deg,var(--amb) 0 5px,transparent 5px 12px) top/100% 3px no-repeat,repeating-linear-gradient(90deg,var(--amb) 0 5px,transparent 5px 12px) bottom/100% 3px no-repeat,repeating-linear-gradient(0deg,var(--amb) 0 5px,transparent 5px 12px) left/3px 100% no-repeat,repeating-linear-gradient(0deg,var(--amb) 0 5px,transparent 5px 12px) right/3px 100% no-repeat;filter:drop-shadow(0 0 4px var(--amb));animation:chase 1.2s steps(4) infinite}
@keyframes chase{to{background-position:24px 0,-24px 100%,0 -24px,100% 24px}}
.tC .lu{background:#071a13;border:1px solid #163428;border-left:4px solid var(--tc0)}
.tC .lu .p{color:var(--grn)}
.tC .resbtns .a{border:2px solid #23463a;color:var(--grn);border-radius:6px;font-family:"Black Han Sans"}
.tC .resbtns .b{border:3px solid var(--amb);color:var(--amb);border-radius:6px;font-family:"Black Han Sans";text-shadow:0 0 8px rgba(255,190,40,.9)}
.tC .field .grass{fill:#0c3a22}.tC .field .grass2{fill:#0a321d}.tC .field .dirt{fill:#3a2a17}.tC .field .line{stroke:var(--grn)}

/* ═════════ D 프런트오피스 (OOTP) ═════════ */
body.tD{--bg:#15171b;--app-bg:#1b1e23;--fg:#e6e8eb;--team:#2b6cb0;--team2:#fff;--ok:#2fbf4a}
.tD .logo{margin-top:24px}
.tD .logo .l1{font-family:"Oswald";font-weight:700;font-size:22px;letter-spacing:.06em;color:#cfd3d8}
.tD .logo .big{color:#fff;display:flex;align-items:center}
.tD .logo .big .ball{display:inline-block;width:.78em;height:.78em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e9e6dc 60%,#c9c3b2);position:relative;margin-left:.04em;box-shadow:inset -6px -8px 14px rgba(0,0,0,.18)}
.tD .logo .big .ball::before,.tD .logo .big .ball::after{content:"";position:absolute;top:8%;bottom:8%;width:40%;border:3px dashed #d33;border-radius:50%}
.tD .logo .big .ball::before{left:-14%;border-left-color:transparent;border-top-color:transparent;border-bottom-color:transparent}
.tD .logo .big .ball::after{right:-14%;border-right-color:transparent;border-top-color:transparent;border-bottom-color:transparent}
.tD .logo .seung{color:#ff8a1f}
.tD .logo .l3{color:#9aa1a9}
.tD .frame{background:#24282e;border:1px solid #33383f;border-radius:4px}
.tD .playmain{background:linear-gradient(180deg,#38d156,#23a63c);color:#fff;border-radius:4px;font-family:"Oswald";font-weight:700;letter-spacing:.04em;box-shadow:0 2px 0 #157a29}
.tD .playmain small{color:#e8ffe9}
.tD .mode{border-left:4px solid #ff8a1f}
.tD .mode b{font-family:"Noto Sans KR";font-weight:900;font-size:18px}
.tD .tabbar{background:#121418;margin:auto -18px 0;padding:8px 0}
.tD .tabbar button.on{color:#ff8a1f}
.tD .hdr{position:relative;margin:0 0 4px;height:58px;background:var(--team);color:var(--team2);display:flex;align-items:center;gap:10px;padding:0 14px;overflow:hidden;transition:background .5s}
.tD .hdr .ht{font-family:"Oswald";font-weight:700;font-size:22px;letter-spacing:.02em}
.tD .hdr .hs{font-size:12px;font-weight:700;opacity:.85}
.tD .hdr .sweep{position:absolute;inset:0;background:var(--newteam);clip-path:inset(0 100% 0 0)}
.tD .topbar{background:#121418;padding:8px 14px}
.tD .rnd{font-family:"Oswald";font-weight:700;color:#cfd3d8}
.tD .gauge{background:#0e1013;border-radius:2px}
.tD .gauge .fill{background:linear-gradient(90deg,#d64545 0%,#e8a33a 35%,#e6d94a 55%,#5cc95c 75%,#38c6d9 100%);background-size:390px 100%}
.tD .gaugev{font-family:"Oswald";color:#fff}
.tD .reel{background:#24282e;border:1px solid #33383f;border-radius:4px}
.tD .reel .lab{color:#9aa1a9;text-align:left;padding-left:10px}
.tD .reel .win{inset:22px 8px 8px}
.tD .reel .cell{color:#fff;font-family:"Oswald";font-weight:700;justify-content:flex-start;padding-left:4px}
.tD .reel.team .cell{font-family:"Noto Sans KR";font-weight:900}
.tD .reel::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--team)}
.tD .reel.land::after{animation:uline .45s ease-out forwards}
@keyframes uline{to{width:100%}}
.tD .reroll{color:#cfd3d8}
.tD .slot{background:#121418;color:#fff;border-left:4px solid #555;border-radius:2px;font-weight:900}
.tD .slot.empty{color:#7c838c;border:1px dashed #555;border-left:4px solid #555}
.tD .slot.justset{animation:slidein .4s cubic-bezier(.2,.9,.3,1)}
@keyframes slidein{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.tD .spin{background:linear-gradient(180deg,#38d156,#23a63c);color:#fff;border-radius:4px;font-family:"Oswald";font-weight:700;box-shadow:0 2px 0 #157a29}
.tD .sheet{background:#1b1e23;border-top:3px solid var(--team);color:#e6e8eb}
.tD .sheet .tabs button{background:#24282e;border-radius:2px;color:#cfd3d8}
.tD .sheet .tabs button.on{background:var(--team);color:var(--team2)}
.tD .row{background:#24282e;border-radius:2px;border-left:4px solid var(--tc0)}
.tD .row .st{font-size:16px}
.tD .row.signed{background:#1e3b25}
.tD .row .chk{display:none}
.tD .result{padding-top:50px}
.tD .result .cap{color:#9aa1a9;letter-spacing:.2em}
.tD .result .rec{font-size:64px;color:#fff}
.tD .result .rec .dash{font-size:40px}.tD .result .rec .l{font-size:44px}
.tD .stand{width:100%;margin-top:8px;position:relative;opacity:0}
.tD .stand .sr{display:grid;grid-template-columns:28px 10px 1fr 48px 48px 52px;align-items:center;height:26px;padding:0 8px;font-size:13px;font-weight:700;background:#24282e;margin-bottom:2px;text-align:left;position:relative}
.tD .stand .sr.hd{background:transparent;color:#7c838c;font-size:11px;height:22px}
.tD .stand .sr .cl{width:6px;height:18px;background:var(--c)}
.tD .stand .sr .n{padding-left:6px}
.tD .stand .sr span.r{text-align:right;font-family:"Oswald";font-weight:500}
.tD .stand .sr.me{background:linear-gradient(90deg,#3a2d10,#24282e);color:#ffcf6a;outline:2px solid #ff8a1f;z-index:2}
.tD .news{width:100%;margin-top:10px;background:#f2efe6;color:#1b1b1b;text-align:left;padding:10px 12px;border-radius:2px;opacity:0;transform-origin:50% 50%}
.tD .news .nk{font-size:10px;font-weight:900;letter-spacing:.2em;color:#a12a2a;border-bottom:1px solid #1b1b1b;padding-bottom:4px}
.tD .news .nh{font-family:"Nanum Myeongjo";font-weight:800;font-size:22px;line-height:1.25;margin-top:6px}
.tD .news .ns{font-size:12px;margin-top:4px;color:#444}
.tD .badge{display:none}
.tD .lineup{display:none}
.tD .resbtns .a{background:#24282e;color:#cfd3d8;border-radius:4px;font-family:"Oswald";font-weight:700}
.tD .resbtns .b{background:linear-gradient(180deg,#38d156,#23a63c);color:#fff;border-radius:4px;font-family:"Oswald";font-weight:700}

function ledc(c){const h=vis(c).replace('#','');const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);const R=r/255,G=g/255,B=b/255,mx=Math.max(R,G,B),mn=Math.min(R,G,B),d=mx-mn;let H=0;if(d){H=mx===R?((G-B)/d)%6:mx===G?(B-R)/d+2:(R-G)/d+4;H*=60;if(H<0)H+=360}let l=(mx+mn)/2,s=d?d/(1-Math.abs(2*l-1)):0;if(s<.15)return '#e8e8e8';return `hsl(${Math.round(H)} ${Math.round(Math.max(s,.75)*100)}% ${Math.round(Math.max(l,.6)*100)}%)`} // 전광판 글자용: 어두운 팀색은 밝게

function toast(msg){const t=$("#toast");t.textContent=msg;t.getAnimations().forEach(a=>a.cancel());t.animate([{opacity:0},{opacity:1,offset:.15},{opacity:1,offset:.8},{opacity:0}],{duration:1100})}
function countTo(el,from,to,ms){const t0=performance.now();return new Promise(res=>{const st=t=>{const k=Math.min(1,(t-t0)/(reduce?1:ms)),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*e);k<1?requestAnimationFrame(st):res()};requestAnimationFrame(st)})}
function valueOf(p){return p.r?((4.6-p.era)*2.5+(p.k9-6.5)*.6):((p.avg-.275)*120+(p.slg-.43)*40+p.hr*.08+p.sb*.03)}
function tierOf(p){const v=valueOf(p);return v>=10?"gold":v>=4?"silver":"bronze"}

function renderSlots(justKey){
  const f=$("#field");f.querySelectorAll(".slot").forEach(s=>s.remove());
  SLOTS.forEach(s=>{const d=document.createElement("button");d.className="slot press";d.id="slot_"+s.k;d.style.left=s.x+"%";d.style.top=s.y+"%";
    const p=S.filled[s.k];
    if(!p){d.classList.add("empty");d.textContent=s.lab}
    else{d.classList.add("filled");const th=TH();
      if(th==="tC"){d.innerHTML=s.k===justKey?[...p.n].map((c,i)=>`<span class="ch" style="--k:${i}">${c}</span>`).join(""):p.n}
      else d.textContent=p.n;
      if(th==="tD"){d.style.borderLeftColor=vis(p.tc)}
      if(th==="tE"){d.style.setProperty("--sc",vis(p.tc));d.classList.add(tierOf(p))}
      if(s.k===justKey)d.classList.add("justset");}
    f.appendChild(d)});
}

function setCell(sel,v){const st=$(sel+" .strip");st.getAnimations().forEach(a=>a.cancel());st.style.transform="translateY(0)";st.innerHTML=`<div class="cell">${v}</div>`;return st}
function landFX(sel){const r=$(sel);["land","lock"].forEach(c=>r.classList.remove(c));void r.offsetWidth;r.classList.add(TH()==="tC"?"lock":"land");buzz(15)}
function spinScroll(sel,finalVal,pool,ms){return new Promise(res=>{
  const vals=[];for(let i=0;i<18;i++)vals.push(pool[Math.floor(Math.random()*pool.length)]);vals.push(finalVal);
  const st=setCell(sel,"");st.innerHTML=vals.map(v=>`<div class="cell">${v}</div>`).join("");const h=56,end=-(vals.length-1)*h;
  if(reduce){st.style.transform=`translateY(${end}px)`;landFX(sel);res();return}
  st.animate([{transform:"translateY(0)"},{transform:`translateY(${end}px)`}],{duration:ms,easing:"cubic-bezier(.12,.7,.2,1)",fill:"forwards"}).onfinish=()=>{landFX(sel);res()}})}
function spinFlicker(sel,finalVal,pool,ms){return new Promise(res=>{   // 전광판: 굴러가지 않고 숫자가 바뀌며 점점 느려짐
  const st=setCell(sel,"");st.innerHTML="";const cell=document.createElement("div");cell.className="cell dimc";st.appendChild(cell);
  if(reduce){cell.textContent=finalVal;cell.className="cell";landFX(sel);res();return}
  const t0=performance.now();let gap=45;
  const tick=()=>{const el=performance.now()-t0;if(el>=ms){cell.className="cell";cell.textContent=finalVal;landFX(sel);res();return}
    cell.textContent=pool[Math.floor(Math.random()*pool.length)];gap=45+Math.pow(el/ms,2.2)*230;setTimeout(tick,gap)};tick()})}

async function teamFX(t){
  const th=TH(), c=t.col;
  if(th==="tC"){const m=$("#marq");m.style.setProperty("--tc",ledc(c));$("#marqT").textContent=`★ ${t.y} ${t.t} ${t.nick} ★`;m.classList.add("on");
    if(!reduce)await $("#marqT").animate([{left:"100%",transform:"translate(0,-50%)"},{left:"0%",transform:"translate(-100%,-50%)"}],{duration:1500,easing:"linear"}).finished;
    m.classList.remove("on")}
  if(th==="tD"){const h=$("#hdr"),sw=$("#sweep");sw.style.setProperty("--newteam",c[0]);
    if(!reduce)await sw.animate([{clipPath:"inset(0 100% 0 0)"},{clipPath:"inset(0 0 0 0)"}],{duration:420,easing:"cubic-bezier(.6,0,.2,1)"}).finished;
    h.style.setProperty("--team",c[0]);h.style.color=c[1];$("#app").style.setProperty("--team",c[0]);$("#app").style.setProperty("--team2",c[1]);
    $("#hT").textContent=`${t.y} ${t.t} ${t.nick}`;$("#hS").textContent="한 명 영입";
    $("#hT").animate([{transform:"translateX(-20px)",opacity:0},{transform:"none",opacity:1}],{duration:300,easing:"ease-out"})}
  if(th==="tE"){const pn=$("#pennant"),pf=pn.querySelector(".pf");pf.style.setProperty("--tc0",c[0]);pf.style.setProperty("--tc1",c[1]);pf.style.setProperty("--tc2",c[2]);
    $("#py").textContent=t.y;$("#pt").textContent=t.t;pn.classList.add("on");
    if(!reduce)await pn.animate([{transform:"translateY(-130%) rotate(0)"},{transform:"translateY(120px) rotate(6deg)",offset:.35},{transform:"translateY(120px) rotate(-4deg)",offset:.5},{transform:"translateY(120px) rotate(2deg)",offset:.62},{transform:"translateY(120px) rotate(0)",offset:.8},{transform:"translateY(-130%) rotate(0)"}],{duration:1500,easing:"ease-in-out"}).finished;
    pn.classList.remove("on")}
}

const YEARS=[2001,2003,2005,2007,2009,2011,2013,2019,2021,2023,2024,2025,...new Set(DATA.map(d=>d.y))];
const TEAMS=[...new Set(DATA.map(d=>d.t))];
async function doSpin(which="both"){
  if(S.spinning)return;S.spinning=true;$("#spin").disabled=true;$("#sheet").classList.remove("up","peek");
  const prev=S.cur;let cand=DATA.filter(d=>d!==prev);
  if(which==="year"&&prev)cand=DATA.filter(d=>d.t===prev.t&&d.y!==prev.y);
  if(which==="team"&&prev)cand=DATA.filter(d=>d.y===prev.y&&d.t!==prev.t);
  const t=cand[Math.floor(Math.random()*cand.length)];S.cur=null;updRR();
  const spin=TH()==="tC"?spinFlicker:spinScroll,ps=[];
  if(which!=="team")ps.push(spin("#rY",t.y,YEARS,1000));else setCell("#rY",t.y);
  if(which!=="year")ps.push(spin("#rT",t.t,TEAMS,which==="both"?1450:1000));else setCell("#rT",t.t);
  await Promise.all(ps);await wait(150);
  await teamFX(t);S.cur=t;S.spinning=false;openSheet(t,"H");updRR();
}
function updRR(){$("#rrY").disabled=!S.cur||S.spinning||S.cY<=0;$("#rrT").disabled=!S.cur||S.spinning||S.cT<=0}
$("#spin").onclick=()=>doSpin("both");
$("#rrY").onclick=()=>{if(!S.cur||S.cY<=0||S.spinning)return;S.cY--;$("#cY").textContent=S.cY;doSpin("year")};
$("#rrT").onclick=()=>{if(!S.cur||S.cT<=0||S.spinning)return;S.cT--;$("#cT").textContent=S.cT;doSpin("team")};
function togglePeek(){const sh=$("#sheet");if(!S.cur)return;if(sh.classList.contains("up")){sh.classList.replace("up","peek");$("#peekhint").textContent="올리기"}else if(sh.classList.contains("peek")){sh.classList.replace("peek","up");$("#peekhint").textContent="내리기"}}
$("#shHead").onclick=togglePeek;$("#grab").onclick=togglePeek;

/* ── 시트: D는 기록을 색으로 ── */
function heat(v,lo,hi,inv){let k=(v-lo)/(hi-lo);if(inv)k=1-k;k=Math.max(0,Math.min(1,k));const cs=["#d64545","#e8a33a","#e6d94a","#5cc95c","#38c6d9"];return cs[Math.min(4,Math.floor(k*5))]}
function openSheet(t,k){
  $("#shT").textContent=`${t.y} ${t.t}`;$("#shS").textContent=t.nick;
  document.querySelectorAll(".sheet .tabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  const D=TH()==="tD",arr=k==="H"?t.H:t.P;
  $("#list").innerHTML=arr.map((p,i)=>{const can=SLOTS.some(s=>!S.filled[s.k]&&s.ok(p));
    const st=k==="H"?[[p.avg.toFixed(3).replace(/^0/,""),"타율",heat(p.avg,.25,.34)],[p.slg.toFixed(3).replace(/^0/,""),"장타",heat(p.slg,.36,.58)],[p.hr,"홈런",heat(p.hr,3,35)],[p.sb,"도루",heat(p.sb,0,30)]]
                   :[[p.era.toFixed(2),"ERA",heat(p.era,2.5,5.5,true)],[p.k9.toFixed(1),"K9",heat(p.k9,5,10)],["","",""],["","",""]];
    return `<button class="row press ${can?"":"dim"}" style="--i:${i};--tc0:${vis(t.col)}" data-i="${i}" data-k="${k}"><span><div class="nm">${p.n}</div><div class="ps">${k==="H"?p.pos.join(" "):(p.r==="SP"?"선발":"불펜")}</div></span>${st.map(s=>`<span class="st" style="${D&&s[2]?"color:"+s[2]:""}">${s[0]}<small>${s[1]}</small></span>`).join("")}</button>`}).join("");
  const sh=$("#sheet"),wasUp=sh.classList.contains("up");sh.classList.remove("peek");if(!wasUp){void sh.offsetWidth;sh.classList.add("up")}$("#peekhint").textContent="내리기";
  $("#list").querySelectorAll(".row").forEach(r=>r.onclick=()=>pick(r));
}
document.querySelectorAll(".sheet .tabs button").forEach(b=>b.onclick=()=>S.cur&&!S.spinning&&openSheet(S.cur,b.dataset.k));

/* ── 선수 선택 연출 ── */
async function cardReveal(p,t,slotEl){  // E: 카드가 뒤집히고 자리로 날아감
  const ov=$("#cardov"),tier=tierOf(p),c=t.col;
  const st=p.r?[[p.era.toFixed(2),"ERA"],[p.k9.toFixed(1),"K9"],[p.r==="SP"?"선발":"불펜","역할"],["",""]]:[[p.avg.toFixed(3).replace(/^0/,""),"타율"],[p.slg.toFixed(3).replace(/^0/,""),"장타"],[p.hr,"홈런"],[p.sb,"도루"]];
  ov.innerHTML=`<div class="cwrap" id="cw"><div class="card ${tier}" id="cd" style="--tc0:${c[0]};--tc1:${c[1]};--tcv:${ledc(c)}"><div class="glow"></div><div class="face back"></div><div class="face front"><div class="tier"><span>${{gold:"S",silver:"A",bronze:"B"}[tier]}</span></div><div class="band"><span class="yr">${t.y}</span><span class="tm">${t.t} ${t.nick}</span><span class="no">${t.y%100}</span></div><div class="nmc${TH()==="tC"?" typing":""}">${TH()==="tC"?[...p.n].map((ch,i)=>`<span class="ch" style="--k:${i+4}">${ch}</span>`).join(""):p.n}</div><div class="psc">${p.r?(p.r==="SP"?"선발 투수":"불펜 투수"):p.pos.join(" · ")}</div><div class="stc">${st.map(s=>`<span>${s[0]}<small>${s[1]}</small></span>`).join("")}</div></div></div></div>`;
  ov.classList.add("on");const cd=$("#cd"),cw=$("#cw");
  if(!reduce){await cw.animate([{transform:"translateY(60px) scale(.7)",opacity:0},{transform:"none",opacity:1}],{duration:280,easing:"ease-out",fill:"forwards"}).finished;
    await cd.animate([{transform:"rotateY(0)"},{transform:"rotateY(190deg)",offset:.8},{transform:"rotateY(180deg)"}],{duration:620,easing:"cubic-bezier(.4,0,.2,1)",fill:"forwards"}).finished;
    cd.classList.add("shown");buzz(tier==="gold"?[20,30,40]:20);await wait(tier==="gold"?700:450);
    const cb=cd.getBoundingClientRect(),tb=slotEl.getBoundingClientRect();
    await cw.animate([{transform:"none",opacity:1},{transform:`translate(${tb.left+tb.width/2-(cb.left+cb.width/2)}px,${tb.top+tb.height/2-(cb.top+cb.height/2)}px) scale(.3)`,opacity:.5}],{duration:420,easing:"cubic-bezier(.5,0,.6,1)",fill:"forwards"}).finished}
  ov.classList.remove("on");ov.innerHTML="";
}
async function pick(row){
  if(!S.cur||S.spinning)return;
  if(row.classList.contains("dim")){row.classList.remove("nope");void row.offsetWidth;row.classList.add("nope");buzz(8);toast("넣을 자리 없음");return}
  const t=S.cur,k=row.dataset.k,p=(k==="H"?t.H:t.P)[+row.dataset.i];
  const slot=SLOTS.find(s=>!S.filled[s.k]&&s.ok(p));if(!slot)return;
  S.cur=null;updRR();buzz(12);const th=TH();
  if(th==="tD"){row.classList.add("signed");await wait(260)}
  $("#sheet").classList.remove("up","peek");
  if(th==="tE"||th==="tC"){await wait(150);await cardReveal(p,t,$("#slot_"+slot.k))}
  else await wait(300);
  S.filled[slot.k]={...p,tc:t.col};renderSlots(slot.k);buzz(20);
  const before=S.power;S.power=Math.max(0,Math.min(100,S.power+14+valueOf(p)*2));
  $("#gfill").style.width=S.power+"%";countTo($("#gval"),before,S.power,650);
  S.round++;
  if(S.round>=SLOTS.length){setTimeout(showResult,900);return}
  $("#rnd").textContent=`ROUND ${S.round+1}/5`;$("#spin").disabled=false;
  if(th==="tD"){$("#hS").textContent="다음 룰렛"}
}

/* ── 결과 ── */
async function showResult(){
  show("sRes");const th=TH();
  const sum=Object.values(S.filled).map(valueOf).reduce((a,b)=>a+b,0);
  const W=Math.max(48,Math.min(108,Math.round(72+sum*.7))),L=144-W-2;
  const G=W>=100?["S","PERFECT"]:W>=94?["A+","HISTORIC"]:W>=88?["A","CHAMPION"]:W>=80?["B","CONTENDER"]:W>=72?["C","PLAYOFF"]:W>=64?["D","AVERAGE"]:["F","REBUILD"];
  ["#rcap","#rrec","#resb","#badge","#stand","#news"].forEach(s=>{const e=$(s);e.getAnimations().forEach(a=>a.cancel());e.style.opacity=0;e.classList.remove("on")});
  $("#rw").textContent=0;$("#rl").textContent=0;
  $("#lineup").innerHTML=SLOTS.map(s=>{const p=S.filled[s.k];return `<div class="lu ${th==="tE"?tierOf(p):""}" style="--tc0:${vis(p.tc)};--tc0x:${p.tc[0]};--tc1x:${p.tc[1]}"><span class="p">${s.lab}</span><span class="n">${p.n}<small>${p.r?("ERA "+p.era.toFixed(2)):(p.avg.toFixed(3).replace(/^0/,"")+" · "+p.hr+"홈런")}</small></span><span class="num">${valueOf(p)>=0?"+":""}${valueOf(p).toFixed(1)}</span></div>`}).join("");
  const fade=(s,ms=380)=>$(s).animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],{duration:reduce?1:ms,fill:"forwards",easing:"ease-out"});
  await wait(250);fade("#rcap");await wait(300);$("#rrec").style.opacity=1;

  if(th==="tD"){ // 순위표를 뚫고 올라감
    const rows=[...STAND.map(s=>({...s,me:false})),{t:"내 팀",w:0,l:0,d:0,col:["#ff8a1f","#fff","#ff8a1f"],me:true}];
    const me=rows[rows.length-1];const box=$("#stand");
    box.innerHTML=`<div class="sr hd"><span>#</span><span></span><span class="n">팀</span><span class="r">승</span><span class="r">패</span><span class="r">승률</span></div>`+rows.map((r,i)=>`<div class="sr ${r.me?"me":""}" data-i="${i}"><span class="rk"></span><span class="cl" style="--c:${vis(r.col)}"></span><span class="n">${r.t}</span><span class="r w">${r.w}</span><span class="r l">${r.l}</span><span class="r p">${r.w+r.l?(r.w/(r.w+r.l)).toFixed(3).replace(/^0/,""):".000"}</span></div>`).join("");
    fade("#stand");
    const els=[...box.querySelectorAll(".sr:not(.hd)")];const meEl=els[els.length-1];
    const place=()=>{const order=rows.map((r,i)=>i).sort((a,b)=>(rows[b].w/(rows[b].w+rows[b].l||1))-(rows[a].w/(rows[a].w+rows[a].l||1)));
      order.forEach((idx,rank)=>{const el=els[idx];el.style.position="absolute";el.style.left=0;el.style.right=0;el.style.top=(22+rank*28)+"px";el.querySelector(".rk").textContent=rank+1});
      box.style.height=(22+rows.length*28)+"px";return order.indexOf(rows.length-1)+1};
    els.forEach(e=>e.style.transition="top .35s cubic-bezier(.3,.8,.3,1)");place();
    const steps=reduce?1:24;let rank=11;
    for(let i=1;i<=steps;i++){me.w=Math.round(W*i/steps);me.l=Math.round(L*i/steps);$("#rw").textContent=me.w;$("#rl").textContent=me.l;
      meEl.querySelector(".w").textContent=me.w;meEl.querySelector(".l").textContent=me.l;meEl.querySelector(".p").textContent=(me.w/(me.w+me.l||1)).toFixed(3).replace(/^0/,"");
      const nr=place();if(nr<rank){buzz(6)}rank=nr;await wait(70)}
    $("#nh").textContent=W>=100?`${W}승, 꿈의 100승 고지`:rank===1?`${W}승으로 정규시즌 1위`:`${W}승, 리그 ${rank}위로 마감`;
    $("#ns").textContent=`등급 ${G[0]} · ${G[1]} · 2026 순위표 기준`;
    await wait(300);$("#news").animate([{opacity:0,transform:"rotate(-540deg) scale(.1)"},{opacity:1,transform:"rotate(-2deg) scale(1)"}],{duration:reduce?1:700,fill:"forwards",easing:"cubic-bezier(.2,.8,.3,1)"});buzz([20,30]);
  } else {
    if(th==="tE"){const tk=document.createElement("div");}
    const rw=$("#rw"),rl=$("#rl"),ms=reduce?1:(th==="tC"?1500:1300),t0=performance.now();let last=-1;
    await new Promise(res=>{const step=t=>{const k=Math.min(1,(t-t0)/ms),e=th==="tC"?k:1-Math.pow(1-k,2.4);const w=Math.round(W*e);rw.textContent=w;rl.textContent=Math.round(L*e);
      if(w!==last&&w%10===0)buzz(4);last=w;k<1?requestAnimationFrame(step):res()};requestAnimationFrame(step)});
    await wait(250);$("#bg").textContent=G[0];$("#bgl").textContent=G[1];
    if(th==="tC"){$("#badge").animate([{opacity:0},{opacity:1,offset:.2},{opacity:.2,offset:.4},{opacity:1,offset:.6},{opacity:.3,offset:.8},{opacity:1}],{duration:reduce?1:600,fill:"forwards",easing:"steps(1)"});$("#badge").classList.add("on")}
    else{$("#badge").animate([{opacity:0,transform:"rotate(45deg) scale(1.8)"},{opacity:1,transform:"rotate(45deg) scale(.94)",offset:.7},{opacity:1,transform:"rotate(45deg) scale(1)"}],{duration:reduce?1:420,fill:"forwards",easing:"cubic-bezier(.3,.6,.4,1)"})}
    buzz([30,40]);
    if(W>=100&&th==="tC")pixelFireworks();
    await wait(450);
    $("#lineup").querySelectorAll(".lu").forEach((e,i)=>setTimeout(()=>e.animate(th==="tE"?[{opacity:0,transform:"translateY(-40px) rotate(-8deg)"},{opacity:1,transform:"rotate(0)"}]:[{opacity:0,transform:"translateX(-12px)"},{opacity:1,transform:"none"}],{duration:reduce?1:320,fill:"forwards",easing:"ease-out"}),i*(reduce?0:110)));
  }
  await wait(700);fade("#resb");
}
$("#again").onclick=()=>{show("sDraft");startDraft()};
$("#share").onclick=()=>{$("#share").textContent="복사 완료";setTimeout(()=>$("#share").textContent="공유",1200)};
function pixelFireworks(){if(reduce)return;const c=$("#fw"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;x.imageSmoothingEnabled=false;
  const P=[],cols=["#ffd23a","#7dff8a","#ff6a3a","#ffffff"];
  for(let b=0;b<4;b++)setTimeout(()=>{const cx=innerWidth*(.2+Math.random()*.6),cy=innerHeight*(.12+Math.random()*.25),col=cols[b%4];for(let i=0;i<36;i++){const a=i/36*Math.PI*2,v=3;P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:44,c:col})}},b*300);
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy=p.vy*.96+.05;p.l--;if(p.l>0&&(p.l>10||p.l%4<2)){x.fillStyle=p.c;x.fillRect(Math.round(p.x/5)*5,Math.round(p.y/5)*5,4,4)}});
    for(let i=P.length-1;i>=0;i--)if(P[i].l<=0)P.splice(i,1);if(++f<200)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})()}

const q=new URLSearchParams(location.search);
if(q.get("t"))setTheme(q.get("t"));
window.__auto=async()=>{show("sDraft");startDraft();
  for(let r=0;r<5;r++){await doSpin("both");await wait(400);let row=null;
    for(const k of ["H","P"]){openSheet(S.cur,k);await wait(400);row=[...document.querySelectorAll("#list .row")].find(x=>!x.classList.contains("dim"));if(row)break}
    if(!row){r--;continue}await pick(row);await wait(400)}};
if(q.get("auto"))setTimeout(()=>window.__auto(),400);
</script>
